services:
  - type: web
    name: farmnova-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
